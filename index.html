<script type="module">
import * as THREE from 'three';
import { Sky } from 'three/addons/objects/Sky.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { GTAOPass } from 'three/addons/postprocessing/GTAOPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

/* ---------- content ---------- */
const EGGS = {
  strava:   { ttl: 'See you<br>on Strava', body: 'Chasing another sub 3', cta: 'Open Strava ↗', url: 'https://www.strava.com/athletes/759106' },
  song:     { cta: 'Open on YouTube ↗', url: 'https://youtu.be/HPgWvYH8-o4', video: 'HPgWvYH8-o4' },
  fognini:  { cta: 'Open on YouTube ↗', url: 'https://youtu.be/6b_JJ2R814o', video: '6b_JJ2R814o' },
  linkedin: { ttl: 'Write me<br>on LinkedIn', body: 'Product at Unobravo', cta: 'Open LinkedIn ↗', url: 'https://www.linkedin.com/in/bonizzimarco/' },
};

/* look: "poster" (flat print style, default) or ?style=real (previous lit 3D) */
const POSTER = new URLSearchParams(location.search).get('style') !== 'real';
document.body.classList.toggle('poster', POSTER);
const SKY = 0xF6E3C5;
const PALETTE = [0xF4EFE6, 0xF6E3C5, 0xE4D8C4, 0xC9B99F, 0x9A8B78, 0x4A3F35, 0x1F1B16, 0xE2572B, 0xF0A27C, 0xA8452E, 0xE9B44C, 0x2F5D8A, 0xA9C3CF, 0x6F8F5A, 0x3F5B3E, 0x7391A3];

const END = 300;
const P = { duomo: 14, navA: 90, navB: 154, busker: 121, arco: 186, ball: 193, office: 222, unicredit: 254, bosco: 280 };

/* ---------- renderer ---------- */
const canvas = document.getElementById('c');
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
} catch (e) {
  document.body.classList.add('nogl');
  document.getElementById('loader').classList.add('done');
  throw e;
}
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.75));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.62;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
scene.fog = POSTER ? new THREE.Fog(SKY, 90, 420) : new THREE.Fog(0xE9D6BC, 120, 430);
const camera = new THREE.PerspectiveCamera(38, innerWidth / innerHeight, 0.1, 1500);

/* post-processing: ambient occlusion + soft bloom (desktop only) */
const HQ = !matchMedia('(pointer:coarse)').matches;
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
let gtao = null;
if (HQ && !POSTER) {
  gtao = new GTAOPass(scene, camera, innerWidth, innerHeight);
  gtao.updateGtaoMaterial({ radius: 1.6, distanceExponent: 1.5, thickness: 2, scale: 1.1, samples: 12 });
  gtao.blendIntensity = 0.9;
  composer.addPass(gtao);
}
composer.addPass(new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.22, 0.55, 0.9));
composer.addPass(new OutputPass());

/* poster look: flat toon colours snapped to a small palette, ink outlines, paper grain */
let sunDisc = null, renderPoster = null, resizePoster = null;
if (POSTER) {
  renderer.shadowMap.autoUpdate = false;
  const pr = renderer.getPixelRatio();
  const rtC = new THREE.WebGLRenderTarget(innerWidth * pr, innerHeight * pr, { type: THREE.HalfFloatType, samples: 4 });
  const depthTex = new THREE.DepthTexture(innerWidth * pr, innerHeight * pr); depthTex.type = THREE.FloatType;
  const rtN = new THREE.WebGLRenderTarget(innerWidth * pr, innerHeight * pr, { depthTexture: depthTex, minFilter: THREE.NearestFilter, magFilter: THREE.NearestFilter });
  const normalMat = new THREE.MeshNormalMaterial({ side: THREE.DoubleSide });
  const figureMat = new THREE.ShaderMaterial({ vertexShader: 'void main(){ gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.); }', fragmentShader: 'void main(){ gl_FragColor = vec4(.5, .5, 1., 0.); }' });
  camera.layers.enableAll();
  const postMat = new THREE.ShaderMaterial({
    depthTest: false, depthWrite: false,
    uniforms: {
      tColor: { value: rtC.texture }, tNormal: { value: rtN.texture }, tDepth: { value: depthTex },
      uRes: { value: new THREE.Vector2(innerWidth * pr, innerHeight * pr) }, uPx: { value: Math.max(1, pr * .85) },
      uNear: { value: camera.near }, uFar: { value: camera.far },
      uPal: { value: PALETTE.map(h => { const c = new THREE.Color(); c.setHex(h, THREE.LinearSRGBColorSpace); return new THREE.Vector3(c.r, c.g, c.b); }) },
    },
    vertexShader: 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy, 0., 1.); }',
    fragmentShader: `
      uniform sampler2D tColor, tNormal, tDepth; uniform vec2 uRes; uniform float uPx, uNear, uFar; uniform vec3 uPal[${PALETTE.length}];
      varying vec2 vUv;
      float lin(vec2 uv){ float z = texture2D(tDepth, uv).x * 2. - 1.; return 2. * uNear * uFar / (uFar + uNear - z * (uFar - uNear)); }
      void main(){
        vec3 c = pow(clamp(texture2D(tColor, vUv).rgb, 0., 1.), vec3(1. / 2.2));
        vec3 best = c; float bd = 1e9;
        for (int i = 0; i < ${PALETTE.length}; i++) { vec3 d = c - uPal[i]; float dd = dot(d, d); if (dd < bd) { bd = dd; best = uPal[i]; } }
        c = mix(c, best, .9);
        vec2 o = uPx / uRes;
        float fig = min(min(texture2D(tNormal, vUv).a, texture2D(tNormal, vUv + o).a), min(min(texture2D(tNormal, vUv - o).a, texture2D(tNormal, vUv + o * vec2(-1., 1.)).a), texture2D(tNormal, vUv + o * vec2(1., -1.)).a));
        if (fig < .5) o *= .45;
        vec2 a = vUv + o, b = vUv - o, e = vUv + o * vec2(-1., 1.), f = vUv + o * vec2(1., -1.);
        float d0 = lin(a), d1 = lin(b), d2 = lin(e), d3 = lin(f), dm = min(min(d0, d1), min(d2, d3));
        float de = (abs(d0 - d1) + abs(d2 - d3)) / dm;
        float ne = length(texture2D(tNormal, a).rgb - texture2D(tNormal, b).rgb) + length(texture2D(tNormal, e).rgb - texture2D(tNormal, f).rgb);
        float edge = max(smoothstep(.1, .2, de), smoothstep(.35, .7, ne)) * (1. - smoothstep(110., 320., dm));
        c = mix(c, uPal[6], edge * (fig < .5 ? .7 : .92));
        float g = fract(sin(dot(gl_FragCoord.xy, vec2(12.9898, 78.233))) * 43758.5453);
        c *= .95 + .08 * g;
        gl_FragColor = vec4(c, 1.);
      }`,
  });
  const postScene = new THREE.Scene(), postCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
  const quad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), postMat); quad.frustumCulled = false; postScene.add(quad);
  renderPoster = () => {
    renderer.shadowMap.needsUpdate = true;
    renderer.setRenderTarget(rtC); renderer.render(scene, camera);
    const bg = scene.background; scene.background = null; scene.overrideMaterial = normalMat; if (sunDisc) sunDisc.visible = false;
    camera.layers.set(0);
    renderer.setRenderTarget(rtN); renderer.render(scene, camera);
    // figures (layer 1) go in flat, flagged by alpha 0: silhouette-only, thinner outline
    camera.layers.set(1); scene.overrideMaterial = figureMat; renderer.autoClear = false;
    renderer.render(scene, camera);
    renderer.autoClear = true; camera.layers.enableAll();
    scene.overrideMaterial = null; scene.background = bg; if (sunDisc) sunDisc.visible = true;
    renderer.setRenderTarget(null); renderer.render(postScene, postCam);
  };
  resizePoster = () => { const w = innerWidth * pr, h = innerHeight * pr; rtC.setSize(w, h); rtN.setSize(w, h); postMat.uniforms.uRes.value.set(w, h); };
}

/* ---------- sky, sun, environment ---------- */
const sky = new Sky();
sky.scale.setScalar(5000);
const su = sky.material.uniforms;
su.turbidity.value = 5.5; su.rayleigh.value = 1.5; su.mieCoefficient.value = 0.004; su.mieDirectionalG.value = 0.82;
const sunDir = new THREE.Vector3().setFromSphericalCoords(1, THREE.MathUtils.degToRad(90 - 10), THREE.MathUtils.degToRad(-58));
su.sunPosition.value.copy(sunDir);
const pmrem = new THREE.PMREMGenerator(renderer);
const envScene = new THREE.Scene(); envScene.add(sky);
scene.environment = pmrem.fromScene(envScene).texture;
scene.environmentIntensity = 0.45;
scene.add(sky);

const hemi = new THREE.HemisphereLight(0xBFD3E6, 0x7A5E44, 0.55); scene.add(hemi);
const sun = new THREE.DirectionalLight(0xFFBE7D, 5.2);
if (POSTER) {
  scene.remove(sky); scene.environment = null; scene.background = new THREE.Color(SKY);
  hemi.color.set(0xffffff); hemi.groundColor.set(0xE6DCCB); hemi.intensity = 2.15;
  sun.color.set(0xffffff); sun.intensity = 1.3;
  sunDisc = new THREE.Mesh(new THREE.CircleGeometry(46, 64), new THREE.MeshBasicMaterial({ color: 0xE2572B, fog: false }));
  sunDisc.position.set(0, 165, -520); scene.add(sunDisc);
}
const gradTex = new THREE.DataTexture(new Uint8Array([120, 120, 120, 255, 195, 195, 195, 255, 255, 255, 255, 255]), 3, 1, THREE.RGBAFormat);
gradTex.minFilter = gradTex.magFilter = THREE.NearestFilter; gradTex.needsUpdate = true;
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -75, right: 75, top: 55, bottom: -55, near: 1, far: 420 });
sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.035;
scene.add(sun, sun.target);

/* ---------- helpers ---------- */
const mat = (color, o = {}) => {
  if (!POSTER) return new THREE.MeshStandardMaterial({ color, roughness: 0.82, metalness: 0, ...o });
  const { roughness, metalness, ...rest } = o;
  return new THREE.MeshToonMaterial({ color, gradientMap: gradTex, ...rest });
};
const add = (m, cast = true, recv = true) => { m.castShadow = cast; m.receiveShadow = recv; scene.add(m); return m; };
function box(w, h, d, m, x, y, z, cast = true) { const me = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), m); me.position.set(x, y, z); return add(me, cast); }
const rnd = (a, b) => a + Math.random() * (b - a);
let seed = 7; const srnd = (a, b) => { seed = (seed * 16807) % 2147483647; return a + (seed / 2147483647) * (b - a); };
const pick = arr => arr[Math.floor(srnd(0, arr.length))];

function canvasTex(w, h, draw, repeat) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = renderer.capabilities.getMaxAnisotropy();
  if (repeat) { t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(repeat[0], repeat[1]); }
  return t;
}
function speckle(g, w, h, n, a) { if (POSTER) return; for (let i = 0; i < n; i++) { const v = Math.random() < .5 ? 0 : 255; g.fillStyle = `rgba(${v},${v},${v},${Math.random() * a})`; g.fillRect(Math.random() * w, Math.random() * h, 1 + Math.random() * 2, 1 + Math.random() * 2); } }

/* facade texture: grid of windows, optional shutters / ringhiera / shop front */
function facadeTex(wu, hu, o) {
  const ppu = Math.min(36, 1024 / Math.max(wu, hu));
  const W = Math.round(wu * ppu), H = Math.round(hu * ppu);
  const cols = o.cols ?? Math.max(1, Math.round(wu / 2.3));
  const rows = o.rows ?? Math.max(1, Math.round(hu / 3.1));
  return canvasTex(W, H, (g) => {
    g.fillStyle = o.base; g.fillRect(0, 0, W, H);
    speckle(g, W, H, W * H / 9, 0.07);
    const grad = g.createLinearGradient(0, 0, 0, H); grad.addColorStop(0, 'rgba(255,255,255,0.05)'); grad.addColorStop(1, 'rgba(0,0,0,0.12)');
    if (!POSTER) { g.fillStyle = grad; g.fillRect(0, 0, W, H); }
    const cw = W / cols, ch = H / rows;
    for (let r = 0; r < rows; r++) {
      if (o.band) { g.fillStyle = 'rgba(0,0,0,.08)'; g.fillRect(0, r * ch + ch * .9, W, ch * .1); }
      for (let c = 0; c < cols; c++) {
        const x = c * cw + cw * .25, y = r * ch + ch * .22, ww = cw * .5, hh = ch * .56;

/* Cards never overwrite each other: a stop reached while a card is open waits in a queue
   (its dot pulses) until the open card is closed. Any found dot reopens its card. */
const order = [], queue = [];
let openId = null, allToast = false;
function closeCard() {
  card.classList.remove('show'); openId = null;
  setTimeout(() => {
    if (openId) return;
    media.innerHTML = '';
    if (queue.length) { queue.sort((a, b) => order.indexOf(a) - order.indexOf(b)); show(queue.shift()); }
  }, 320);
}
function discover(id) {
  if (found.has(id)) return;
  found.add(id); order.push(id);
  const d = dots[order.length - 1]; d.classList.add('on'); d.disabled = false; d.setAttribute('aria-label', `Stop ${order.length}, open card`);
}
function reveal(id) {
  discover(id);
  if (openId && openId !== id) { if (!queue.includes(id)) queue.push(id); dots[order.indexOf(id)].classList.add('wait'); return; }
  show(id);
}
dots.forEach((d, i) => d.addEventListener('click', () => {
  const id = order[i]; if (!id || id === openId) return;
  const q = queue.indexOf(id); if (q >= 0) queue.splice(q, 1);
  show(id);
}));
function show(id) {
  const e = EGGS[id];
  openId = id; dots[order.indexOf(id)].classList.remove('wait');

  $('cTtl').innerHTML = e.ttl ?? ''; $('cBody').textContent = e.body ?? ''; $('cCta').textContent = e.cta; $('cCta').href = e.url;

  if (found.size === 4 && !allToast) { allToast = true; setTimeout(() => toast('4 / 4 · You know me better than my LinkedIn does.', 6500), 1600); }
}

const portrait = () => innerWidth / innerHeight < 1;
let intro = 1;
const hDist = $('hDist'), hPace = $('hPace'), hHr = $('hHr'), hZone = $('hZone'), title = $('title');

function frame() {
  const dt = Math.max(1e-3, Math.min(clock.getDelta(), .05)); elapsed += dt;
  if (keys.has('ArrowRight') || keys.has('ArrowDown') || keys.has(' ')) target += 16 * dt;
  if (keys.has('ArrowLeft') || keys.has('ArrowUp')) target -= 16 * dt;
  clampT();

  prevX = youX; youX += (target - youX) * (1 - Math.exp(-dt * 3.2));
  const v = (youX - prevX) / dt; vs += (v - vs) * Math.min(1, dt * 6);
  const sp = Math.abs(vs), amt = Math.min(1, sp / 3.5);

  // you
  you.ph += dt * (6.5 + sp * 1.4) * (amt > .03 ? 1 : 0);
  poseRun(you, amt);
  if (amt < .03) { you.pelvis.position.y = .93 + Math.sin(elapsed * 2) * .006; }
  you.root.position.x = youX;
  const face = vs < -.2 ? Math.PI : 0; you.root.rotation.y += (face - you.root.rotation.y) * Math.min(1, dt * 8);

  // Marco
  const lead = portrait() ? 3.4 : 6.5;
  const mt = Math.min(youX + lead, END + 3);
  const mPrev = marco.root.position.x; marco.root.position.x += (mt - mPrev) * (1 - Math.exp(-dt * 2.4));
  const mv = Math.abs(marco.root.position.x - mPrev) / dt;
  if (waveT > 0) {
    waveT -= dt;
    marco.root.rotation.y += (-Math.PI / 2 - marco.root.rotation.y) * Math.min(1, dt * 8);
    poseRun(marco, 0);
    marco.armR.a.rotation.set(-2.5 + Math.sin(elapsed * 14) * .35, 0, 0); marco.armR.b.rotation.z = .3;
  } else {
    marco.root.rotation.y += (0 - marco.root.rotation.y) * Math.min(1, dt * 6);
    const ma = Math.max(.42, Math.min(1, mv / 3.5));
    marco.ph += dt * (6.5 + mv * 1.4);
    poseRun(marco, ma);
    marco.head.rotation.y = (sp < .1 && Math.sin(elapsed * .7) > .6) ? 1.1 : 0;
  }

  // easter eggs: fire once when you run past
  TRIGGERS.forEach(t => { if (!t.done && youX >= t.x) { t.done = true; discover(t.id); t.run(); setTimeout(() => reveal(t.id), t.delay); } });

  busker.armL.a.rotation.set(0, 0, 1.15); busker.armL.b.rotation.z = .9;
  busker.armR.a.rotation.set(0, 0, .55); busker.armR.b.rotation.z = 1.35 + (playing ? Math.sin(elapsed * 16) * .25 : 0);
  busker.pelvis.position.y = .93 + (playing ? Math.abs(Math.sin(elapsed * 4)) * .015 : 0);
  busker.head.rotation.z = playing ? Math.sin(elapsed * 2) * .12 : 0;
  if (playing && Math.abs(youX - P.busker) < 25) { noteT -= dt; if (noteT <= 0) { popAt(new THREE.Vector3(P.busker + rnd(-.4, .4), 2.1, -9.4), Math.random() < .5 ? '♪' : '♫'); noteT = .5; } }

  // ball physics
  if (ballLive) {
    ballV.y -= 14 * dt; ball.position.addScaledVector(ballV, dt);
    ball.rotation.z -= ballV.x * dt * 4;
    const floor = (ball.position.z > 2.6 ? .15 : 0) + .18;
    if (ball.position.y < floor) { ball.position.y = floor; ballV.y *= -.55; ballV.x *= .82; ballV.z *= .82; if (Math.abs(ballV.y) < .4) ballV.y = 0; }
    if (ballV.lengthSq() < .01) ballLive = false;
  }

  // tram
  tram.position.x -= 7 * dt;
  if (tram.position.x < youX - 90) tram.position.x = youX + 95;

  // pigeons
  pigeons.forEach(p => {
    p.t += dt;
    if (!p.fly) {
      p.h.position.y = .2 - Math.max(0, Math.sin(p.t * 3)) * .06;
      if (Math.abs(p.g.position.x - youX) < 2.6 && p.g.position.z > -10.5 && sp > .3) { p.fly = true; p.v.set(rnd(-2, 3), rnd(3.5, 5), rnd(-3, -1)); p.wl.visible = p.wr.visible = true; }
    } else {
      p.g.position.addScaledVector(p.v, dt); p.v.y += .6 * dt;
      p.wl.rotation.x = Math.sin(p.t * 30) * .9; p.wr.rotation.x = -Math.sin(p.t * 30) * .9;
      if (p.g.position.y > 40) { p.fly = false; p.wl.visible = p.wr.visible = false; p.g.position.set(youX + rnd(30, 60), p.y0, p.y0 > 0 ? rnd(3.3, 4.8) : rnd(-13, -9)); }
    }
  });

  // water ripple
  const wpos = __water.geometry.attributes.position, base = __water.userData.base;
  for (let i = 0; i < wpos.count; i++) wpos.array[i * 3 + 2] = base[i * 3 + 2] + Math.sin(base[i * 3] * .9 + elapsed * 1.6) * .04 + Math.cos(base[i * 3 + 1] * 2.1 + elapsed * 1.1) * .03;
  wpos.needsUpdate = true; __water.geometry.computeVertexNormals();

  // lit window flicker
  litGlow.intensity = litOn ? 6 + Math.sin(elapsed * 9) * .4 : 0;

  // camera
  intro = Math.max(0, intro - dt / 2.6);
  const e = intro * intro * (3 - 2 * intro);
  const pt = portrait();
  const camX = youX + (pt ? 1.8 : 4.5);
  const bob = Math.abs(Math.cos(you.ph)) * .05 * amt;
  camera.fov = pt ? 62 : 40; camera.updateProjectionMatrix();
  camera.position.set(camX - e * 4, (pt ? 3.6 : 5.2) + bob + e * 9, (pt ? 20 : 23) + e * 18);
  camera.lookAt(camX + (pt ? 0 : 1.2), (pt ? 9.5 : 8) + e * 8, -24);

  if (sunDisc) { sunDisc.position.x = camX + (pt ? 30 : 110); sunDisc.position.y = pt ? 230 : 165; }
  sun.target.position.set(camX + 10, 0, -14);
  sun.position.copy(sun.target.position).addScaledVector(sunDir, 160);

  // HUD
  hDist.textContent = (youX / END * 42.195).toFixed(2) + ' km';
  if (sp < .15) hPace.textContent = '—:—'; else { const s = Math.max(1, Math.min(5999, Math.round(240 / sp))); hPace.textContent = `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`; }
  hr += ((66 + sp * 30) - hr) * Math.min(1, dt * 1.3);
  const H = Math.round(hr); hHr.textContent = H;
  const z = H < 100 ? 1 : H < 130 ? 2 : H < 155 ? 3 : H < 175 ? 4 : H < 195 ? 5 : H < 215 ? 6 : 7; hZone.textContent = `${z} / 5`;
  title.classList.toggle('small', youX > 6);

  if (!finished && youX > END - .5) { finished = true; toast('Finish. 2nd of 2. Marco waited for you.', 6000); }

  if (renderPoster) renderPoster(); else composer.render();
  requestAnimationFrame(frame);
}

addEventListener('resize', () => { renderer.setSize(innerWidth, innerHeight); composer.setSize(innerWidth, innerHeight); if (resizePoster) resizePoster(); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); });
Promise.race([document.fonts.ready, new Promise(r => setTimeout(r, 1500))]).then(() => {
  requestAnimationFrame(() => { frame(); setTimeout(() => $('loader').classList.add('done'), 250); });
});
</script>
</body>
</html>
